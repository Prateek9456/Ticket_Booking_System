services:
  - type: web
    name: ticket-booking-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://ticket-booking-system-red.vercel.app
      - key: SEAT_HOLD_TTL_MINUTES
        value: "10"
      - key: WAITLIST_OFFER_TTL_MINUTES
        value: "15"
